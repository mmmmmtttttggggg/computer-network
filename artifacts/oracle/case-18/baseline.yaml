apiVersion: v1
kind: Namespace
metadata:
  labels:
    team: apps
  name: apps
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    team: data
  name: data
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: a
  name: a
  namespace: apps
spec:
  containers:
  - image: data-only/not-executed
    name: app
    ports:
    - containerPort: 8080
      name: web
      protocol: TCP
    - containerPort: 5353
      name: dns
      protocol: UDP
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: b
  name: b
  namespace: apps
spec:
  containers:
  - image: data-only/not-executed
    name: app
    ports:
    - containerPort: 8081
      name: web
      protocol: TCP
    - containerPort: 5353
      name: dns
      protocol: UDP
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: a
  name: a
  namespace: data
spec:
  containers:
  - image: data-only/not-executed
    name: app
    ports:
    - containerPort: 8080
      name: web
      protocol: TCP
    - containerPort: 5353
      name: dns
      protocol: UDP
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: b
  name: b
  namespace: data
spec:
  containers:
  - image: data-only/not-executed
    name: app
    ports:
    - containerPort: 8081
      name: web
      protocol: TCP
    - containerPort: 5353
      name: dns
      protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: p-0
  namespace: apps
spec:
  egress: []
  ingress:
  - {}
  - from:
    - namespaceSelector: {}
      podSelector:
        matchExpressions:
        - key: app
          operator: NotIn
          values:
          - a
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - a
          - b
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - a
      - b
  policyTypes:
  - Ingress
  - Egress
