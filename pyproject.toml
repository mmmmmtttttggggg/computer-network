[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "networkpolicy-digital-twin"
version = "1.2.0"
description = "NetScope: Kubernetes policy digital twin, agent containment, and reproducible regression experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "hypothesis==6.170.13", "ruff==0.14.3"]
browser = ["playwright==1.64.1"]

[project.scripts]
netscope = "app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["resources/examples/*.json", "web/static/*.html", "web/static/*.css", "web/static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E9", "F"]
